<!DOCTYPE html><html><head><meta charset='utf-8'><style>
                body {
                    margin: 0; background: transparent; color: #FFD700;
                    font-family: "Arial Narrow", Arial, sans-serif;
                    font-size: clamp(10px, 1.9vw, 24px); /* Tự động co giãn theo khung màn hình */
                    font-weight: bold; overflow: hidden;
                    display: flex; align-items: center; justify-content: center;
                    height: 100vh; text-shadow: 1px 1px 2px #000;
                }
                .container { 
                    display: flex; flex-direction: row; align-items: center; 
                    white-space: nowrap; gap: 0.8vw; width: 100%; justify-content: center; 
                }
                .l { color: #FFFFFF; }
                .v { color: #00FF00; margin-left: 0.3vw; }
                .s { color: #FFFFFF; opacity: 0.6; margin: 0 0.3vw; }
            </style></head>
            <body>
                <div class="container">
                    <span class="l">GIÁ BÁN LẺ (Đ/L):</span>
                    <span>XĂNG E10 RON 95-III:<span class="v">20.550</span></span>
                    <span class="s">|</span>
                    <span>DẦU DO 0,001S-V:<span class="v">25.420</span></span>
                    <span class="s">|</span>
                    <span>DẦU DO 0,05S-II:<span class="v">23.320</span></span>
                </div>
            </body></html>
